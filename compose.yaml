services:
  db:
    image: postgres:17.10-bookworm
    container_name: countercloser-postgres
    environment:
      POSTGRES_USER: countercloser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: countercloser
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - countercloser_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countercloser -d countercloser"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  countercloser_data:
